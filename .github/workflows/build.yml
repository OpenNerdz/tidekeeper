name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset-name: macOS-arm64
          - os: macos-15-intel
            asset-name: macOS-x86_64
          # PyInstaller does not bundle glibc. Build x86_64 on the oldest
          # supported runner so the executable works on newer distributions.
          - os: ubuntu-22.04
            asset-name: Linux-x86_64
          - os: ubuntu-24.04-arm
            asset-name: Linux-arm64
          - os: windows-latest
            asset-name: Windows-x86_64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py
            TIDALDL-PY/pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel pyinstaller
          python -m pip install -e ".[gui]"
        working-directory: TIDALDL-PY

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Clean directory
        shell: bash
        run: |
          rm -rf dist build release-assets *.egg-info tidekeeper.spec tidekeeper-gui.spec
        working-directory: TIDALDL-PY

      - name: Build tidekeeper
        run: pyinstaller -F tidal_dl/__main__.py -n tidekeeper
        working-directory: TIDALDL-PY

      - name: Smoke test terminal executable
        shell: bash
        run: ./dist/tidekeeper --help
        working-directory: TIDALDL-PY

      - name: Build tidekeeper-gui
        shell: bash
        run: |
          GUI_FLAGS=""
          if [[ "${{ runner.os }}" != "Linux" ]]; then
            GUI_FLAGS="--windowed"
          fi
          pyinstaller -F $GUI_FLAGS \
            --add-data "tidal_dl/gui_app/supporters.json:tidal_dl/gui_app" \
            tidal_dl/gui_app/__main__.py -n tidekeeper-gui
        working-directory: TIDALDL-PY

      - name: Smoke test Linux GUI executable
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          TIDEKEEPER_GUI_DEMO: '1'
        working-directory: TIDALDL-PY
        run: |
          python - <<'PY'
          import subprocess

          with subprocess.Popen(['./dist/tidekeeper-gui'], stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT) as process:
              try:
                  output, _ = process.communicate(timeout=10)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  try:
                      output, _ = process.communicate(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      output, _ = process.communicate()
                  text = output.decode(errors='replace')
                  print(text)
                  assert 'Traceback' not in text, 'GUI emitted a traceback during startup'
                  print('GUI stayed running in offscreen demo mode for 10 seconds')
              else:
                  raise SystemExit(f'GUI exited during startup ({process.returncode}): {output.decode(errors="replace")}')
          PY

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "dist/tidekeeper.exe" "release-assets/tidekeeper-${{ matrix.asset-name }}.exe"
            cp "dist/tidekeeper-gui.exe" "release-assets/tidekeeper-gui-${{ matrix.asset-name }}.exe"
          else
            chmod +x dist/tidekeeper dist/tidekeeper-gui
            tar -czf "release-assets/tidekeeper-${{ matrix.asset-name }}.tar.gz" -C dist tidekeeper
            tar -czf "release-assets/tidekeeper-gui-${{ matrix.asset-name }}.tar.gz" -C dist tidekeeper-gui
          fi
        working-directory: TIDALDL-PY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tidekeeper-${{ matrix.asset-name }}
          path: TIDALDL-PY/release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tidekeeper-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - name: Create release after all platform builds succeed
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*

  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    secrets: inherit
