name: Refresh supporters

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-supporters
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch current stargazers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="TIDALDL-PY/tidal_dl/gui_app/supporters.json"
          temporary="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/stargazers?per_page=100" \
            | jq -s '[.[][] | .login]' > "$temporary"
          if cmp -s "$temporary" "$target"; then
            exit 0
          fi
          mv "$temporary" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "chore: refresh supporters [skip ci]"
          git push
