name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      publish-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

# The prefix must differ from Build: reusable workflows inherit github.workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref != '' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  dependencies:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/pyproject.toml
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py
            .github/workflows/ci.yml
            .github/requirements/audit.txt
      - name: Audit the installed terminal and GUI dependencies
        working-directory: TIDALDL-PY
        run: |
          python -m pip install -e ".[gui]" -r ../.github/requirements/audit.txt
          python -m pip_audit --local

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            .github/requirements/lint.txt

      - name: Install Ruff
        run: python -m pip install -r ../.github/requirements/lint.txt

      - name: Ruff (high-signal rules)
        run: python -m ruff check tidal_dl tests ../scripts

      - name: Installer script syntax
        run: |
          bash -n ../install.sh
          bash -n ../build.sh
          bash -n ../scripts/install-termux.sh

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/pyproject.toml
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py

      - name: Install package
        run: |
          python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q tidal_dl

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Smoke test terminal commands
        run: |
          python -m tidal_dl --help
          tidekeeper --help
          tidal-dl --help

  gui-smoke:
    name: GUI screenshot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb xauth

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/pyproject.toml
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py
            .github/workflows/ci.yml

      - name: Install GUI package
        run: |
          python -m pip install -e ".[gui]"

      - name: Compile package
        run: python -m compileall -q tidal_dl scripts/gui_screenshots.py

      - name: Run tests with Qt installed
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Capture GUI screenshots
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python scripts/gui_screenshots.py --output gui-screenshots

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-screenshots
          path: TIDALDL-PY/gui-screenshots/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/pyproject.toml
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py
            .github/workflows/ci.yml
            .github/requirements/package.txt

      - name: Build sdist and wheel
        run: |
          python -m pip install -r ../.github/requirements/package.txt
          python -m build --outdir dist .

      - name: Validate metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Assert long description survived the sdist round trip
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          archive = zipfile.ZipFile(wheel)
          name = next(n for n in archive.namelist() if n.endswith("METADATA"))
          metadata = archive.read(name).decode()
          assert "# Tidekeeper" in metadata, "README missing from wheel metadata"
          print("long description OK", len(metadata), "bytes")
          EOF

      - name: Smoke test the installed wheel outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m tidal_dl --help
          tidekeeper --help
          tidal-dl --help
          python - <<'PY'
          import json
          from importlib.resources import files

          supporters = files("tidal_dl.gui_app").joinpath("supporters.json")
          assert isinstance(json.loads(supporters.read_text(encoding="utf-8")), list)
          print("Installed wheel includes GUI supporter data")
          PY

      - name: Save validated distributions for publishing
        if: inputs.publish-artifacts || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: TIDALDL-PY/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
