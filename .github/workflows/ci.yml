name: CI

on:
  push:
    branches: [main, working]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit the installed terminal and GUI dependencies
        working-directory: TIDALDL-PY
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pip-audit
          python -m pip_audit --local

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (high-signal rules)
        run: python -m ruff check tidal_dl tests

      - name: Installer script syntax
        run: |
          bash -n ../install.sh
          bash -n ../build.sh
          bash -n ../scripts/install-termux.sh

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            TIDALDL-PY/pyproject.toml
            TIDALDL-PY/requirements.txt
            TIDALDL-PY/setup.py

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q tidal_dl

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Smoke test terminal commands
        run: |
          python -m tidal_dl --help
          tidekeeper --help
          tidal-dl --help

  gui-smoke:
    name: GUI screenshot smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: TIDALDL-PY/pyproject.toml

      - name: Install GUI package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"

      - name: Compile package
        run: python -m compileall -q tidal_dl scripts/gui_screenshots.py

      - name: Run tests with Qt installed
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Capture GUI screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui_screenshots.py --output gui-screenshots

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-screenshots
          path: TIDALDL-PY/gui-screenshots/*.png

  package:
    name: Package metadata
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .

      - name: Validate metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Assert long description survived the sdist round trip
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          archive = zipfile.ZipFile(wheel)
          name = next(n for n in archive.namelist() if n.endswith("METADATA"))
          metadata = archive.read(name).decode()
          assert "# Tidekeeper" in metadata, "README missing from wheel metadata"
          print("long description OK", len(metadata), "bytes")
          EOF
