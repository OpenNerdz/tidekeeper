name: Publish

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/p/tidekeeper

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: TIDALDL-PY/dist

      - name: Require configured PyPI token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN is required for this reusable publish workflow"
            exit 1
          fi

      - name: Stage only distributions not already published with matching hashes
        id: stage
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/publish-release.py stage-pypi --tag "$RELEASE_TAG" \
            --directory TIDALDL-PY/dist --staging pypi-upload

      - name: Publish with API token
        if: steps.stage.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-upload
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify both published distribution hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish-release.py verify-pypi --tag "$RELEASE_TAG" --directory TIDALDL-PY/dist
