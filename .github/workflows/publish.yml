name: Publish

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/tidekeeper

    permissions:
      contents: read

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: TIDALDL-PY/dist

      - name: Require configured PyPI token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN is required for this reusable publish workflow"
            exit 1
          fi

      - name: Publish with API token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: TIDALDL-PY/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
