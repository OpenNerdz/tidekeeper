name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
    name: Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/tidekeeper

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: TIDALDL-PY

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
          python -m twine check --strict dist/*

      - name: Choose PyPI authentication
        id: pypi-auth
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with API token
        if: steps.pypi-auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: TIDALDL-PY/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish with OIDC trusted publishing
        if: steps.pypi-auth.outputs.mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: TIDALDL-PY/dist
